        comparison.scenarios:
        - before_preprocessing
        - after_preprocessing
        - after_preprocessing_feature_selection
        grid_search.cv_folds: 5
        grid_search.early_stop_min_delta: 0.0001
        grid_search.early_stop_patience: 10
        grid_search.inner_n_jobs: 1
        grid_search.max_evaluated_candidates: 20
        grid_search.method: early_stop
        grid_search.min_evaluated_candidates: 20
        grid_search.n_jobs: -1
        grid_search.param_shuffle: true
        grid_search.random_state: 42
        grid_search.scoring: f1
        grid_search.try_smote: true
        grid_search.verbose: 0
        mlflow.experiment_name: Churned_Staged_Preprocess_FS_Grid_v2
        mlflow.registry_name: churn_model_staged_best
        model_selection.metric: test_f1_churned_threshold
        model_selection.threshold: 0.35
        preprocess.target_column: Churned
        staged_pipeline.artifact_dir: artifacts/staged_pipeline
        staged_pipeline.best_summary_path: 
          artifacts/staged_pipeline/best_model_summary.json
        staged_pipeline.compare_results_path: 
          artifacts/staged_pipeline/model_compare_results.csv
        staged_pipeline.threshold_compare_results_path: 
          artifacts/staged_pipeline/threshold_compare_results.csv
        thread_pool.max_workers: 3
        threshold.mode: compare
        threshold.values:
        - 0.5
        - 0.35
