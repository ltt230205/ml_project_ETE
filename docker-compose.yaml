version: "3.8"

# ============================================================
# Customer Churn MLOps stack
# - MinIO: S3-compatible storage for MLflow artifacts + Airflow logs
# - PostgreSQL: backend DB for MLflow and Airflow metadata
# - Redis: Celery broker
# - MLflow: tracking server
# - Airflow: orchestration with CeleryExecutor
# ============================================================

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  image: customer-churn-airflow:2.8.0-python3.10
  env_file:
    - .env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: ${AIRFLOW__CORE__EXECUTOR:-CeleryExecutor}
    AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW__CORE__LOAD_EXAMPLES:-false}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: ${AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION:-true}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflowpass}@postgres:5432/${AIRFLOW_DB_NAME:-airflow}
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflowpass}@postgres:5432/${AIRFLOW_DB_NAME:-airflow}
    AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0

    AIRFLOW__CELERY__WORKER_CONCURRENCY: ${AIRFLOW__CELERY__WORKER_CONCURRENCY:-2}
    AIRFLOW__CELERY__WORKER_PREFETCH_MULTIPLIER: ${AIRFLOW__CELERY__WORKER_PREFETCH_MULTIPLIER:-1}
    AIRFLOW__SCHEDULER__TASK_QUEUED_TIMEOUT: ${AIRFLOW__SCHEDULER__TASK_QUEUED_TIMEOUT:-1800}
    AIRFLOW__SCHEDULER__TASK_QUEUED_TIMEOUT_CHECK_INTERVAL: ${AIRFLOW__SCHEDULER__TASK_QUEUED_TIMEOUT_CHECK_INTERVAL:-60}
    AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: ${AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT:-120}
    AIRFLOW__CORE__DAG_FILE_PROCESSOR_TIMEOUT: ${AIRFLOW__CORE__DAG_FILE_PROCESSOR_TIMEOUT:-180}

    AIRFLOW__LOGGING__REMOTE_LOGGING: ${AIRFLOW__LOGGING__REMOTE_LOGGING:-true}
    AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID: ${AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID:-minio_conn}
    AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER: ${AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER:-s3://airflow-logs}
    AIRFLOW__LOGGING__DELETE_LOCAL_LOGS: ${AIRFLOW__LOGGING__DELETE_LOCAL_LOGS:-true}

    MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
    MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL:-http://minio:9000}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin123}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    DVC_NO_ANALYTICS: ${DVC_NO_ANALYTICS:-1}
    PYTHONUNBUFFERED: ${PYTHONUNBUFFERED:-1}
    PYTHONPATH: ${PYTHONPATH:-/opt/airflow/project}

    _PIP_ADDITIONAL_REQUIREMENTS: ""
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - airflow-logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./:/opt/airflow/project
  networks:
    - ml-network

services:
  minio:
    image: minio/minio:latest
    container_name: minio
    env_file:
      - .env
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    networks:
      - ml-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    env_file:
      - .env
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        echo "Waiting for MinIO..."
        until /usr/bin/mc alias set myminio http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          echo "MinIO is not ready yet..."
          sleep 3
        done

        /usr/bin/mc mb "myminio/$${MLFLOW_ARTIFACT_BUCKET}" --ignore-existing
        /usr/bin/mc mb "myminio/$${DVC_REMOTE_BUCKET}" --ignore-existing
        /usr/bin/mc mb "myminio/$${AIRFLOW_LOG_BUCKET}" --ignore-existing

        echo "MinIO buckets are ready."
    networks:
      - ml-network
    restart: "no"

  postgres:
    image: postgres:15-alpine
    container_name: ml-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${MLFLOW_POSTGRES_USER:-mlflow}
      POSTGRES_PASSWORD: ${MLFLOW_POSTGRES_PASSWORD:-mlflowpass}
      POSTGRES_DB: ${MLFLOW_POSTGRES_DB:-mlflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ml-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MLFLOW_POSTGRES_USER:-mlflow} -d ${MLFLOW_POSTGRES_DB:-mlflow}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres-init:
    image: postgres:15-alpine
    container_name: postgres-init
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${MLFLOW_POSTGRES_PASSWORD:-mlflowpass}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        echo "Checking Airflow role and DB..."

        ROLE_EXISTS=$$(psql -h postgres -U "$${MLFLOW_POSTGRES_USER}" -d "$${MLFLOW_POSTGRES_DB}" -tAc "SELECT 1 FROM pg_roles WHERE rolname='$${AIRFLOW_DB_USER}';")
        if [ "$$ROLE_EXISTS" != "1" ]; then
          psql -h postgres -U "$${MLFLOW_POSTGRES_USER}" -d "$${MLFLOW_POSTGRES_DB}" -c "CREATE ROLE $${AIRFLOW_DB_USER} LOGIN PASSWORD '$${AIRFLOW_DB_PASSWORD}';"
        fi

        DB_EXISTS=$$(psql -h postgres -U "$${MLFLOW_POSTGRES_USER}" -d "$${MLFLOW_POSTGRES_DB}" -tAc "SELECT 1 FROM pg_database WHERE datname='$${AIRFLOW_DB_NAME}';")
        if [ "$$DB_EXISTS" != "1" ]; then
          createdb -h postgres -U "$${MLFLOW_POSTGRES_USER}" -O "$${AIRFLOW_DB_USER}" "$${AIRFLOW_DB_NAME}"
        fi

        psql -h postgres -U "$${MLFLOW_POSTGRES_USER}" -d "$${AIRFLOW_DB_NAME}" -c "GRANT ALL PRIVILEGES ON DATABASE $${AIRFLOW_DB_NAME} TO $${AIRFLOW_DB_USER};"
        psql -h postgres -U "$${MLFLOW_POSTGRES_USER}" -d "$${AIRFLOW_DB_NAME}" -c "GRANT ALL ON SCHEMA public TO $${AIRFLOW_DB_USER};"
        psql -h postgres -U "$${MLFLOW_POSTGRES_USER}" -d "$${AIRFLOW_DB_NAME}" -c "ALTER SCHEMA public OWNER TO $${AIRFLOW_DB_USER};"
        echo "PostgreSQL init is done."
    networks:
      - ml-network
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: airflow-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - ml-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.12.2
    container_name: mlflow-server
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        pip install --no-cache-dir psycopg2-binary boto3
        mlflow server \
          --host 0.0.0.0 \
          --port 5000 \
          --backend-store-uri "postgresql+psycopg2://$${MLFLOW_POSTGRES_USER}:$${MLFLOW_POSTGRES_PASSWORD}@postgres:5432/$${MLFLOW_POSTGRES_DB}" \
          --artifacts-destination "s3://$${MLFLOW_ARTIFACT_BUCKET}/" \
          --serve-artifacts
    environment:
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL:-http://minio:9000}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin123}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    networks:
      - ml-network
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate
        airflow users create \
          --username "$${_AIRFLOW_WWW_USER_USERNAME}" \
          --password "$${_AIRFLOW_WWW_USER_PASSWORD}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email "$${_AIRFLOW_WWW_USER_EMAIL}" || true

        airflow connections delete "$${AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID}" || true
        airflow connections add "$${AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID}" \
          --conn-type aws \
          --conn-extra "{\"aws_access_key_id\": \"$${AWS_ACCESS_KEY_ID}\", \"aws_secret_access_key\": \"$${AWS_SECRET_ACCESS_KEY}\", \"endpoint_url\": \"http://minio:9000\", \"region_name\": \"$${AWS_DEFAULT_REGION}\"}"

        echo "Airflow init is done."
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: webserver
    ports:
      - "${AIRFLOW_WEBSERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler
    restart: unless-stopped

  airflow-worker:
    <<: *airflow-common
    container_name: airflow-worker
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: celery worker
    restart: unless-stopped

  airflow-triggerer:
    <<: *airflow-common
    container_name: airflow-triggerer
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: triggerer
    restart: unless-stopped

volumes:
  minio-data:
  postgres-data:
  redis-data:
  airflow-logs:

networks:
  ml-network:
    driver: bridge
