version: "3.8"

# ============================================================
# Local MLOps stack:
# - MinIO: object storage
# - PostgreSQL: backend DB for MLflow and Airflow
# - Redis: Celery broker for Airflow
# - MLflow: experiment tracking + artifact serving
# - Airflow: orchestration with CeleryExecutor
#
# Run:
#   mkdir -p airflow/dags airflow/plugins
#   docker compose up -d
# ============================================================

x-airflow-common: &airflow-common
  image: apache/airflow:2.8.0-python3.10
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor

    # Airflow DB
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflowpass@postgres:5432/airflow

    # Celery
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflowpass@postgres:5432/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0

    # Security keys - local/dev values. Change them for real usage.
    AIRFLOW__CORE__FERNET_KEY: "4fAMyXo5MD0b6TgOOfaYo56A4_PVqgQd7dpAsg3GdZs="
    AIRFLOW__WEBSERVER__SECRET_KEY: "local-dev-airflow-secret-key-change-me"

    AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    # Remote logging to MinIO
    AIRFLOW__LOGGING__REMOTE_LOGGING: "true"
    AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID: minio_conn
    AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER: s3://airflow-logs

    # Used by boto3/Airflow Amazon provider
    AWS_ACCESS_KEY_ID: minioadmin
    AWS_SECRET_ACCESS_KEY: minioadmin123
    AWS_DEFAULT_REGION: us-east-1

    # For local/dev only. Better build a custom Airflow image in production.
    _PIP_ADDITIONAL_REQUIREMENTS: "apache-airflow-providers-amazon==8.16.0"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - airflow-logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
  networks:
    - ml-network

services:
  # ==================== STORAGE ====================

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console
    volumes:
      - minio-data:/data
    networks:
      - ml-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO...';
      until /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin123; do
        echo 'MinIO is not ready yet...';
        sleep 3;
      done;

      /usr/bin/mc mb myminio/mlflow-artifacts --ignore-existing;
      /usr/bin/mc mb myminio/dvc-remote --ignore-existing;
      /usr/bin/mc mb myminio/airflow-logs --ignore-existing;

      echo 'MinIO buckets are ready.';
      exit 0;
      "
    networks:
      - ml-network
    restart: "no"

  # ==================== DATABASE ====================

  postgres:
    image: postgres:15-alpine
    container_name: ml-postgres
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflowpass
      POSTGRES_DB: mlflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ml-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres-init:
    image: postgres:15-alpine
    container_name: postgres-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: mlflowpass
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e

        echo "Checking Airflow role..."

        ROLE_EXISTS=$$(psql -h postgres -U mlflow -d mlflow -tAc "SELECT 1 FROM pg_roles WHERE rolname='airflow';")

        if [ "$$ROLE_EXISTS" != "1" ]; then
          echo "Creating role airflow..."
          psql -h postgres -U mlflow -d mlflow -c "CREATE ROLE airflow LOGIN PASSWORD 'airflowpass';"
        else
          echo "Role airflow already exists."
        fi

        echo "Checking Airflow database..."

        DB_EXISTS=$$(psql -h postgres -U mlflow -d mlflow -tAc "SELECT 1 FROM pg_database WHERE datname='airflow';")

        if [ "$$DB_EXISTS" != "1" ]; then
          echo "Creating database airflow..."
          createdb -h postgres -U mlflow -O airflow airflow
        else
          echo "Database airflow already exists."
        fi

        echo "Granting privileges..."
        psql -h postgres -U mlflow -d airflow -c "GRANT ALL PRIVILEGES ON DATABASE airflow TO airflow;"
        psql -h postgres -U mlflow -d airflow -c "GRANT ALL ON SCHEMA public TO airflow;"
        psql -h postgres -U mlflow -d airflow -c "ALTER SCHEMA public OWNER TO airflow;"

        echo "PostgreSQL init is done."
    networks:
      - ml-network
    restart: "no"

  # ==================== REDIS ====================

  redis:
    image: redis:7-alpine
    container_name: airflow-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - ml-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ==================== MLFLOW ====================

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.12.2
    container_name: mlflow-server
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e

        pip install --no-cache-dir psycopg2-binary boto3

        mlflow server \
          --host 0.0.0.0 \
          --port 5000 \
          --backend-store-uri postgresql+psycopg2://mlflow:mlflowpass@postgres:5432/mlflow \
          --artifacts-destination s3://mlflow-artifacts/ \
          --serve-artifacts
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "5000:5000"
    networks:
      - ml-network
    restart: unless-stopped

  # ==================== AIRFLOW ====================

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e

        echo "Migrating Airflow metadata DB..."
        airflow db migrate

        echo "Creating Airflow admin user if needed..."
        airflow users create \
          --username airflow \
          --password airflow123 \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@airflow.local || true

        echo "Creating MinIO connection for Airflow remote logs..."
        airflow connections delete 'minio_conn' || true
        airflow connections add 'minio_conn' \
          --conn-type 'aws' \
          --conn-extra '{"aws_access_key_id": "minioadmin", "aws_secret_access_key": "minioadmin123", "endpoint_url": "http://minio:9000", "region_name": "us-east-1"}'

        echo "Airflow init is done."
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\" || curl -f http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler
    restart: unless-stopped

  airflow-worker:
    <<: *airflow-common
    container_name: airflow-worker
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: celery worker
    restart: unless-stopped

  airflow-triggerer:
    <<: *airflow-common
    container_name: airflow-triggerer
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: triggerer
    restart: unless-stopped

volumes:
  minio-data:
  postgres-data:
  redis-data:
  airflow-logs:

networks:
  ml-network:
    driver: bridge
